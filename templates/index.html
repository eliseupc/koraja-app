{% extends 'base.html' %}

{% block title %}Explorar | Mapa de Corrida{% endblock %}

{% block content %}
  <!-- Seção Hero -->
  <section class="hero-premium" style="text-align: center; padding: 40px 0 20px;">
    <span class="eyebrow" style="color: var(--primary); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; font-size: 0.7rem;">Gear up for 2026</span>
    <h1 style="font-size: 2.8rem; margin: 10px 0;">Seu próximo RP começa <span style="color: var(--primary);">aqui.</span></h1>
    <p style="color: var(--text-dim); max-width: 600px; margin: 0 auto 30px;">Busca geoespacial inteligente para atletas que não aceitam rotas comuns.</p>

    <!-- Formulário de Busca Premium unificado -->
    <div class="search-container" style="max-width: 900px; margin: 0 auto;">
        <form class="glass-panel search-grid" action="{{ url_for('search') }}" method="get"
              style="display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 15px; align-items: end; text-align: left; padding: 25px;">

          <div class="search-field">
            <label style="font-size: 0.6rem; font-weight: 800; text-transform: uppercase; color: var(--primary); display: block; margin-bottom: 8px;">Atividade</label>
            <input name="query" type="text" placeholder="Ex: Pista de Atletismo" value="{{ query or '' }}"
                   style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 12px; padding: 12px; color: var(--text-main); outline: none;">
          </div>

          <div class="search-field">
            <label style="font-size: 0.6rem; font-weight: 800; text-transform: uppercase; color: var(--primary); display: block; margin-bottom: 8px;">Localização</label>
            <input name="location" type="text" placeholder="Cidade ou Bairro" value="{{ location or '' }}"
                   style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 12px; padding: 12px; color: var(--text-main); outline: none;">
          </div>

          <div class="search-field">
            <label style="font-size: 0.6rem; font-weight: 800; text-transform: uppercase; color: var(--primary); display: block; margin-bottom: 8px;">Tipo</label>
            <select name="filter_type" style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 12px; padding: 12px; color: var(--text-main); outline: none;">
              <option value="all">Todos os terrenos</option>
              <option value="parque">Parques</option>
              <option value="pista">Pistas</option>
            </select>
          </div>

          <button type="submit" style="background: var(--primary); border: none; border-radius: 12px; width: 48px; height: 46px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: white; transition: transform 0.2s;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </button>
        </form>
    </div>
  </section>

  <!-- Container do Mapa Centralizado -->
  <div style="margin-top: 20px;">
    <div id="map" class="glass-panel" style="height: 500px; width: 100%; padding: 10px; border-radius: var(--radius-lg);">
        <!-- O Leaflet renderiza aqui -->
    </div>
  </div>
{% endblock %}
